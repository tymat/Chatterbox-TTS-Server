    \ the mystery. [pause:0.8s]\n\nWhen encountered outside the religious framework,\
    \ the apocalyptic expectation of imminent transformation of the environment, with\
    \ the individual somehow playing a central role, is labeled pathology. [pause:0.4s]\n\
    This pathological symptom in individuals is the driving force behind much of our\
    \ civilization. [pause:0.4s]\nSome years ago, the secretary of the interior was\
    \ asked why he wasn\u2019t saving more of America\u2019s forests. [pause:0.4s]\n\
    He replied that he saw no reason to save the forests since Jesus was coming, and\
    \ the end of the world was imminent. [pause:1.0s]\n\nWhat is this intuition about\
    \ the end of the world? [pause:0.6s]\nNow that we\u2019re beginning to gather\
    \ more data, science is beginning to pay back on promises made in the eighteenth\
    \ century, to give us a complete and deep description of the physical and astronomical\
    \ universe. [pause:0.6s]\nWhat we\u2019re seeing in this description is a highly\
